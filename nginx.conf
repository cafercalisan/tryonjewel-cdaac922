server {
    listen 80;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── MinIO storage proxy — public read for generated images ──
    location /storage/ {
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://10.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host 10.0.0.1:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        # Nginx-level caching — buffer the upstream response for fast repeat loads
        proxy_buffering on;
        proxy_buffer_size 256k;
        proxy_buffers 8 1m;
        proxy_busy_buffers_size 2m;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # CORS for direct img src usage
        add_header Access-Control-Allow-Origin "*";
    }

    # ── API requests -> Node.js server ──
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    # ── Static assets with long cache (hashed filenames) ──
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Serve pre-compressed files if available
        gzip_static on;
    }

    # ── Frontend -> static files ──
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # HTML files: no cache (so new deploys are picked up)
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
        }
    }
}
